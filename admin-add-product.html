<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Produk — STYLE Admin</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e2725b%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22 font-weight=%22800%22>S</text></svg>">
</head>
<body>
<div class="app-shell">

  <div class="app-header">
    <a class="icon-btn" href="admin-dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Tambah Produk</h1>
    <span class="icon-btn placeholder"></span>
  </div>

  <div class="content">
    <form id="admin-add-form">
      <div class="form-group">
        <label class="form-label">Nama Produk</label>
        <input class="form-input" type="text" placeholder="mis. Korean Blazer" required>
      </div>
      <div class="form-group">
        <label class="form-label">Kategori</label>
        <select class="form-select" required>
          <option value="">Pilih kategori</option>
          <option value="fashion">Fashion</option>
          <option value="makeup">Makeup</option>
          <option value="accessories">Accessories</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Harga (Rp)</label>
        <input class="form-input" type="number" placeholder="mis. 299000" min="0" required>
      </div>
      <div class="form-group">
        <label class="form-label">Foto Produk</label>
        <div class="upload-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="upload-label">Upload Foto</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Data Pendukung Try-On</label>
        <input class="form-input" type="text" placeholder="mis. Ukuran: S, M, L, XL / Shade: Coral Nude, Rosy Mauve">
      </div>
      <div class="form-group">
        <label class="form-label">Deskripsi</label>
        <textarea class="form-textarea" placeholder="Deskripsi singkat produk..."></textarea>
      </div>

      <button class="btn btn-primary" type="submit">Publikasikan Produk</button>
    </form>
  </div>

</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
