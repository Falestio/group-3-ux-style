<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — STYLE</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e2725b%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-family=%22sans-serif%22 font-weight=%22800%22>S</text></svg>">
</head>
<body>
<div class="app-shell">

  <div class="app-header">
    <a class="icon-btn" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Admin Login</h1>
    <span class="icon-btn placeholder"></span>
  </div>

  <div class="content">
    <div style="text-align:center; margin:32px 0 28px;">
      <div class="confirm-icon" style="margin-bottom:14px;">🛠️</div>
      <h2 style="font-size:16px; font-weight:800;">STYLE Admin Panel</h2>
      <p class="muted" style="font-size:11.5px; margin-top:4px;">Kelola katalog produk aplikasi STYLE</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="admin@style.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
  </div>

</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
